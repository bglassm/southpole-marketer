services:
  n8n:
    image: n8nio/n8n:latest
    container_name: southpole-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: sqlite
      DB_SQLITE_DATABASE: /home/node/.n8n/database.sqlite
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-}
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./state/n8n:/home/node/.n8n
      - ./n8n/workflows:${N8N_WORKFLOW_MOUNT_DIR:-/workspace/n8n/workflows}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      pipeline:
        condition: service_healthy

  pipeline:
    build:
      context: ./apps/pipeline
    container_name: southpole-pipeline
    restart: unless-stopped
    ports:
      - "${PIPELINE_PORT:-8080}:8080"
    environment:
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-clockworks/tiktok-scraper}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      APIFY_RESULTS_PER_PAGE: ${APIFY_RESULTS_PER_PAGE:-25}
      APIFY_MAX_ITEMS: ${APIFY_MAX_ITEMS:-200}
      APIFY_TIMEOUT_SECONDS: ${APIFY_TIMEOUT_SECONDS:-600}
      APIFY_PROXY_COUNTRY_CODE: ${APIFY_PROXY_COUNTRY_CODE:-None}
      APIFY_TIKTOK_COMMENTS_ACTOR_ID: ${APIFY_TIKTOK_COMMENTS_ACTOR_ID:-}
      OUTPUT_ROOT: ${OUTPUT_ROOT:-/workspace/outputs/runs}
      OPERATOR_STATE_ROOT: ${OPERATOR_STATE_ROOT:-/workspace/outputs/operator_state}
      BUILD_TAG: ${BUILD_TAG:-local-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-5-mini}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./outputs:${CONTAINER_OUTPUTS_DIR:-/workspace/outputs}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
